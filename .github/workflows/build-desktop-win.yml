name: Build 10Router desktop (Windows)

# Windows 桌面产物 (Setup / Portable / Web-Setup + nsis.7z)。
# 签名走 SignPath Foundation (开源项目免费): 构建产物先 upload 为 Actions artifact,
# 再由 SignPath action 提交签名请求并取回已签文件。未配置 SignPath 时自动降级为
# 上传未签名产物 (与历史行为一致)。
# 注意: 外部签名会使 Setup 的 .exe.blockmap 过期 — 当前未启用 electron-updater
# 差量更新, 无影响; 将来启用时改为在 electron-builder 内集成签名。

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install root dependencies (for cli/app bundle)
        run: npm install --no-audit --no-fund

      - name: Install cli dependencies (esbuild for MITM bundle)
        run: npm install --no-audit --no-fund
        working-directory: cli

      - name: Build CLI bundle (cli/app)
        run: node cli/scripts/build-cli.js

      - name: Install desktop dependencies
        run: npm install --no-audit --no-fund
        working-directory: desktop

      - name: Package Windows artifacts (unsigned)
        run: npx electron-builder --win --x64
        working-directory: desktop

      - uses: actions/upload-artifact@v4
        id: unsigned
        with:
          name: desktop-win-unsigned
          path: |
            desktop/dist/10Router Setup *.exe
            desktop/dist/10Router-Portable-*.exe
            desktop/dist/nsis-web/10Router-Web-Setup-*.exe
            desktop/dist/nsis-web/*.nsis.7z
          if-no-files-found: error

      # SignPath 配置就绪后 (repo variable + secrets), 此步生效; 否则跳过保持未签名上传。
      - name: Sign with SignPath Foundation
        if: vars.SIGNPATH_PROJECT_SLUG != ''
        uses: SignPath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORG_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: desktop/dist/signed

      - name: Assemble release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-files
          if [ -d desktop/dist/signed ] && compgen -G "desktop/dist/signed/*.exe" >/dev/null; then
            echo "using SIGNED exes"
            cp desktop/dist/signed/*.exe release-files/
          else
            echo "using UNSIGNED exes (SignPath not configured)"
            cp desktop/dist/10Router\ Setup\ *.exe release-files/
            cp desktop/dist/10Router-Portable-*.exe release-files/
            cp desktop/dist/nsis-web/10Router-Web-Setup-*.exe release-files/
          fi
          # 7z 是数据载荷 (非 PE 文件), 不经签名, 始终取原始产物
          cp desktop/dist/nsis-web/*.nsis.7z release-files/
          ls -la release-files/

      - name: Upload desktop artifacts to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          # 只附文件, 不写 name/body — 发布说明手工维护, 防重复 run 覆盖。
          files: release-files/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
