name: Build 10Router desktop (Windows)

# Windows 桌面产物 (Setup / Portable / Web-Setup + nsis.7z)。
# 签名走 SignPath Foundation (开源项目免费): 构建产物先 upload 为 Actions artifact,
# 再由 SignPath action 提交签名请求并取回已签文件。未配置 SignPath 时自动降级为
# 上传未签名产物 (与历史行为一致)。
# 注意: 外部签名会使 Setup 的 .exe.blockmap 过期 — 当前未启用 electron-updater
# 差量更新, 无影响; 将来启用时改为在 electron-builder 内集成签名。

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install root dependencies (for cli/app bundle)
        run: npm install --no-audit --no-fund

      - name: Install cli dependencies (esbuild for MITM bundle)
        run: npm install --no-audit --no-fund
        working-directory: cli

      - name: Build CLI bundle (cli/app)
        run: node cli/scripts/build-cli.js

      - name: Install desktop dependencies
        run: npm install --no-audit --no-fund
        working-directory: desktop

      - name: Package Windows artifacts (unsigned)
        run: npx electron-builder --win --x64
        working-directory: desktop

      - uses: actions/upload-artifact@v4
        id: unsigned
        with:
          name: desktop-win-unsigned
          path: |
            desktop/dist/10Router-Win-Setup-*.exe
            desktop/dist/10Router-Win-Portable-*.exe
            desktop/dist/nsis-web/10Router-Win-Web-Setup-*.exe
            desktop/dist/nsis-web/*.nsis.7z
          if-no-files-found: error

      # SignPath 配置就绪后 (repo variable + secrets), 此步生效; 否则跳过保持未签名上传。
      - name: Sign with SignPath Foundation
        if: vars.SIGNPATH_PROJECT_SLUG != ''
        uses: SignPath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORG_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: desktop/dist/signed

      - name: Assemble release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-files
          if [ -d desktop/dist/signed ] && compgen -G "desktop/dist/signed/*.exe" >/dev/null; then
            echo "using SIGNED exes"
            cp desktop/dist/signed/*.exe release-files/
          else
            echo "using UNSIGNED exes (SignPath not configured)"
            cp desktop/dist/10Router-Win-Setup-*.exe release-files/
            cp desktop/dist/10Router-Win-Portable-*.exe release-files/
            cp desktop/dist/nsis-web/10Router-Win-Web-Setup-*.exe release-files/
          fi
          # 7z 是数据载荷 (非 PE 文件), 不经签名, 始终取原始产物
          cp desktop/dist/nsis-web/*.nsis.7z release-files/
          # 校验清单供下载方自行核对 (标准 `sha256sum -c` 格式)。三个发布工作流
          # 并行运行, 所以每组各自一份, 不用共享的 SHA256SUMS.txt (会互相覆盖)。
          # 列出显式扩展名 (不用 `*`): 否则重跑时会把上一轮的 SHA256SUMS-*.txt
          # 也算进清单, 而 `> file` 会在 sha256sum 读取前先把它截断。
          # 怎么核对见 docs/zh-CN/verify-downloads.md
          ( cd release-files && shopt -s nullglob && sha256sum *.exe *.7z > SHA256SUMS-desktop.txt )
          cat release-files/SHA256SUMS-desktop.txt
          ls -la release-files/

      # 确保 release 存在且带标题——否则第一个 attach 文件的 step 会用空 body/裸 tag 名创建它。
      # 已存在时不动（notes 手工维护，绝不能覆盖）。
      - name: Ensure release exists with title
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          gh release view "${{ github.ref_name }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "${{ github.ref_name }}" --repo "$GITHUB_REPOSITORY" \
              --title "10Router ${{ github.ref_name }}" \
              --notes "Release notes pending — see [CHANGELOG.md](https://github.com/techysy/10router/blob/main/CHANGELOG.md)."
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Upload desktop artifacts to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          # 只附文件, 不写 name/body — 发布说明手工维护, 防重复 run 覆盖。
          files: release-files/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
