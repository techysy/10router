name: Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # tests/ import from src/ and open-sse/, so the root deps are required
      # before the suite's own.
      - name: Install dependencies
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm --prefix tests install --no-audit --no-fund

      # The suite is not all-green: see tests/__baseline__/known-fails.txt.
      # Let it finish and let the gate below decide, rather than failing here.
      - name: Run test suite
        id: vitest
        continue-on-error: true
        run: npx vitest run --reporter=json --outputFile="$RUNNER_TEMP/results.json"
        working-directory: tests

      - name: Registry baselines
        run: |
          set -euo pipefail
          node __baseline__/verify-providers.mjs
          node __baseline__/verify-alias.mjs
          node __baseline__/verify-oauth-urls.mjs
        working-directory: tests

      # Informational: prints where every registry model resolves and flags floor /
      # multimodal-name / dead-row problems, so the log shows the capability state.
      # The gate is the vitest case in tests/unit/capability-floor-allowlist.test.js,
      # which asserts the same invariants (and shares this script's tables).
      - name: Capability audit
        run: node --no-warnings scripts/audit-capabilities.mjs

      # Fails only on a test that passed in the baseline and fails now. To
      # re-baseline deliberately, download the artifact below and run
      # `node tests/__baseline__/snapshot-known-fails.mjs <results.json>`.
      - name: Regression gate
        run: node tests/__baseline__/verify-no-regression.mjs "$RUNNER_TEMP/results.json"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-results
          path: ${{ runner.temp }}/results.json
          if-no-files-found: warn
