name: Build 10Router fpk

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-fpk:
    strategy:
      matrix:
        arch: [x86, arm]
    runs-on: ${{ matrix.arch == 'arm' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build standalone server
        run: npm run build

      - name: Copy standalone to fnos-packaging
        run: |
          set -euo pipefail
          rm -rf fnos-packaging/app/server
          mkdir -p fnos-packaging/app/server
          cp -r .next/standalone/. fnos-packaging/app/server/
          cp -r open-sse fnos-packaging/app/server/
          cp -r src/mitm fnos-packaging/app/server/
          mkdir -p fnos-packaging/app/server/node_modules
          cp -r node_modules/node-forge fnos-packaging/app/server/node_modules/
          cp -r node_modules/sql.js fnos-packaging/app/server/node_modules/
          cp -r node_modules/next fnos-packaging/app/server/node_modules/
          cp -r node_modules/better-sqlite3 fnos-packaging/app/server/node_modules/
          ls -la fnos-packaging/app/server/

      - name: Download fnpack
        env:
          FNPACK_VERSION: "1.2.1"
        run: |
          if [ "${{ matrix.arch }}" = "arm" ]; then
            FNPACK_BIN="fnpack-${FNPACK_VERSION}-linux-arm64"
            FNPACK_SHA256="aad9e16b101267d30017f39ab969e3c085fbce209716f8bd3b1e167eaf15e0cf"
          else
            FNPACK_BIN="fnpack-${FNPACK_VERSION}-linux-amd64"
            FNPACK_SHA256="72d2a4095da676b64510b023731a227b369d80f8079bc45ff8a2f802ec0480c1"
          fi
          curl -fsSL -o /usr/local/bin/fnpack "https://static2.fnnas.com/fnpack/${FNPACK_BIN}"
          echo "${FNPACK_SHA256}  /usr/local/bin/fnpack" | sha256sum -c -
          chmod +x /usr/local/bin/fnpack
          fnpack --help | head -3

      - name: Set manifest platform
        run: |
          cd fnos-packaging
          if grep -qE '^platform[[:space:]]*=' manifest; then
            sed -i "s/^platform[[:space:]]*=.*/platform               = ${{ matrix.arch }}/" manifest
          else
            echo "platform               = ${{ matrix.arch }}" >> manifest
          fi
          grep -E '^(platform|appname|version|ctl_stop|install_dep_apps)[[:space:]]*=' manifest

      - name: Remove symlinks
        run: |
          find fnos-packaging -type l -not -path '*/.git/*' -delete 2>/dev/null || true
          echo "symlinks remaining: $(find fnos-packaging -type l -not -path '*/.git/*' | wc -l)"

      - name: Build url variant
        run: |
          set -euo pipefail
          cd fnos-packaging
          jq --exit-status '.".url"."10router.Application".type = "url"' app/ui/config > app/ui/config.tmp
          mv app/ui/config.tmp app/ui/config
          rm -f 10router.fpk
          fnpack build -d .
          [ -f 10router.fpk ] || { echo "ERROR: fnpack build url failed"; exit 1; }
          VERSION="$(grep -E '^version[[:space:]]*=' manifest | head -1 | sed 's/.*=//;s/[[:space:]]//g')"
          [ -n "$VERSION" ] || { echo "ERROR: could not extract version from manifest"; exit 1; }
          mv 10router.fpk "10router-${VERSION}-${{ matrix.arch }}.fpk"
          ls -lh "10router-${VERSION}-${{ matrix.arch }}.fpk"

      - name: Build iframe variant
        run: |
          set -euo pipefail
          cd fnos-packaging
          jq --exit-status '.".url"."10router.Application".type = "iframe"' app/ui/config > app/ui/config.tmp
          mv app/ui/config.tmp app/ui/config
          rm -f 10router.fpk
          fnpack build -d .
          [ -f 10router.fpk ] || { echo "ERROR: fnpack build iframe failed"; exit 1; }
          VERSION="$(grep -E '^version[[:space:]]*=' manifest | head -1 | sed 's/.*=//;s/[[:space:]]//g')"
          [ -n "$VERSION" ] || { echo "ERROR: could not extract version from manifest"; exit 1; }
          mv 10router.fpk "10router-${VERSION}-iframe-${{ matrix.arch }}.fpk"
          ls -lh "10router-${VERSION}-iframe-${{ matrix.arch }}.fpk"

      - name: Upload fpk artifact
        uses: actions/upload-artifact@v4
        with:
          name: 10router-fpk-${{ matrix.arch }}-${{ github.sha }}
          path: fnos-packaging/10router-*.fpk
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build-fpk
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all fpk artifacts
        uses: actions/download-artifact@v4
        with:
          path: fpk-assets
          pattern: 10router-fpk-*
          merge-multiple: true

      # 确保 release 存在且带标题——否则第一个 attach 文件的 step 会用空 body/裸 tag 名创建它。
      # 已存在时不动（notes 手工维护，绝不能覆盖）。
      - name: Ensure release exists with title
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release view "${{ github.ref_name }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "${{ github.ref_name }}" --repo "$GITHUB_REPOSITORY" \
              --title "10Router ${{ github.ref_name }}" \
              --notes "Release notes pending — see [CHANGELOG.md](https://github.com/techysy/10router/blob/main/CHANGELOG.md)."
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: fpk-assets/10router-*.fpk
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "## ✅ 10Router fpk 构建完成" >> "$GITHUB_STEP_SUMMARY"
          ls -lh fpk-assets/ >> "$GITHUB_STEP_SUMMARY"
