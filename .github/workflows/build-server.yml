name: Build 10Router standalone server

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          # Compare only the MAJOR.MINOR.PATCH core. The fnOS manifest has no
          # field for a semver prerelease suffix, so it stays at 1.0.1 while the
          # tag is v1.0.1-rc.1 — a plain string compare rejected every RC tag.
          TAG_CORE="${TAG_VERSION%%-*}"
          MANIFEST_VERSION="$(grep -E '^version[[:space:]]*=' fnos-packaging/manifest | head -1 | sed 's/.*=//;s/[[:space:]]//g')"
          echo "tag=${TAG_VERSION} core=${TAG_CORE} manifest=${MANIFEST_VERSION}"
          if [ "${TAG_CORE}" != "${MANIFEST_VERSION}" ]; then
            echo "ERROR: tag ${GITHUB_REF_NAME} (core ${TAG_CORE}) does not match fnos-packaging/manifest version ${MANIFEST_VERSION}"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build standalone server
        run: |
          NEXT_DIST_DIR=.next-cli-build npm run build

      - name: Prepare app/server structure + package as tar.gz
        run: |
          set -euo pipefail
          STANDALONE=".next-cli-build/standalone"
          rm -rf app-server && mkdir -p app-server
          cp -r "$STANDALONE"/. app-server/
          cp custom-server.js app-server/
          # Next file tracing omits sibling files; MITM runs server.js as a separate process.
          cp -r open-sse app-server/
          cp -r src/mitm app-server/
          npm pack node-forge@latest --pack-destination /tmp 2>/dev/null
          mkdir -p app-server/node_modules/node-forge
          tar xzf /tmp/node-forge-*.tgz -C app-server/node_modules/node-forge --strip-components=1
          # sql.js loads dist/sql-wasm.wasm by path at runtime; tracing only follows JS
          # imports, so the last-resort DB driver would abort with ENOENT without it.
          cp -r node_modules/sql.js app-server/node_modules/
          tar czf 10router-server.tar.gz -C app-server .
          ls -la 10router-server.tar.gz

      - uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/v')"
        with:
          name: 10router-server
          path: 10router-server.tar.gz
          if-no-files-found: error

      # 确保 release 存在且带标题——否则第一个 attach 文件的 step 会用空 body/裸 tag 名创建它。
      # 已存在时不动（notes 手工维护，绝不能覆盖）。
      - name: Ensure release exists with title
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release view "${{ github.ref_name }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "${{ github.ref_name }}" --repo "$GITHUB_REPOSITORY" \
              --title "10Router ${{ github.ref_name }}" \
              --notes "Release notes pending — see [CHANGELOG.md](https://github.com/techysy/10router/blob/main/CHANGELOG.md)."
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Upload server tar.gz to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          # No `name`/`body` here on purpose: the release title and notes are
          # maintained manually per release. This step must only attach files —
          # anything hardcoded below would overwrite the real release notes on
          # every re-run/re-tag.
          files: 10router-server.tar.gz
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
