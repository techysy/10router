name: 🐞 Bug 反馈
description: 路由不通、翻译错乱、仪表盘异常、构建失败 —— 有明确异常行为的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ⚠️ **先确认不是这三类**，能省一轮来回：

        - **macOS 打不开**（提示无法验证开发者）→ 属于未签名，按 [下载说明](https://github.com/techysy/10router/blob/main/README.md#下载) 里的「仍要打开」或 `xattr -cr` 处理即可，不用提 issue。
        - **某供应商连不上 / 返回 401、402、429** → 多半是该供应商的账号、额度或风控问题，不是网关 bug。可先查 [CodeBuddy CN 错误码对照](https://github.com/techysy/10router/blob/main/docs/en/codebuddy-cn-error-codes.md) 与 provider 侧状态；有明确的错误码映射错误再提。
        - **上游 9Router 已修、本仓库还没跟** → 本仓库功能是**重写落地**而非合并上游，同步有节奏，不算 bug。可以在正文里注明「上游 commit/版本已修」，有助于排优先级。

        另外：**npm 包名是 `@techysy/10router`（带作用域）**，无作用域的同名包是第三方，装错了请先卸载重装。

  - type: input
    id: version
    attributes:
      label: 10Router 版本
      description: 仪表盘右下角或 `10router --version` 均可。**如果还没以当前版本复现，请先升级到最新 Release 再确认一次**（很多问题在后面的版本已修）。
      placeholder: 1.2.1
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: 安装 / 运行方式
      description: 五种方式的排查路径完全不同，必须选一个。多种复现时可多选（在正文补充）。
      options:
        - npm 全局安装（@techysy/10router）
        - Docker 容器
        - 飞牛 fnOS 应用包（fpk）
        - Standalone 服务包（10router-server.tar.gz）
        - Windows 桌面版（安装版 / 便携版 / 在线安装器）
        - macOS 桌面版（dmg）
        - 源码开发模式（npm run dev）
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: 运行平台
      options:
        - Windows
        - macOS（Apple Silicon）
        - macOS（Intel）
        - Linux（x86_64）
        - Linux（ARM64）
        - 飞牛 fnOS
    validations:
      required: true

  - type: textarea
    id: symptom
    attributes:
      label: 现象与复现步骤
      description: 尽量具体 —— 做了什么操作、期望什么、实际得到什么（含完整报错文本）。
      placeholder: |
        1. 打开 xxx 页面 / 调用 /v1/chat/completions
        2. 使用 xxx 供应商、xxx 模型
        3. 期望 …，实际 …
    validations:
      required: true

  - type: input
    id: provider-model
    attributes:
      label: 涉及的供应商与模型
      description: 只与某供应商 / 某模型相关时才填。多个用逗号分隔。
      placeholder: 例如 siliconflow / Qwen3-235B，或 codebuddy-cn / claude-sonnet-4
    validations:
      required: false

  - type: input
    id: upstream-ref
    attributes:
      label: 上游对应版本或 commit（可选）
      description: 若确认上游 9router 已修复，填上 tag / commit，便于排优先级。
      placeholder: v0.5.91 或 910db749
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: 日志与报错
      description: |
        服务端启动日志、浏览器控制台输出、或 `/v1` 请求的实际响应体。长文本请折叠或用代码块。
        **务必先脱敏**：不要贴 API Key、OAuth token、JWT_SECRET、Cookie 原文。
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: prechecked
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 issue，确认没有重复报告
          required: true
        - label: 我已尝试用**最新 Release** 复现，或已说明为何无法升级
          required: true
