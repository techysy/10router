name: ✨ 功能建议
description: 新增供应商 / 端点 / 能力，或改进现有行为
title: "[功能] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议。为了能判断「该不该做、怎么做」，请把**要解决的问题**写清楚 —— 比「加一个 X 供应商」更有用的信息是「我在什么场景下，因为缺 X 而做不成什么」。

        几点背景，先说在前面：

        - **新增供应商**有固定套路：复制 `open-sse/providers/REGISTRY_TEMPLATE.js`，往 `config/providerModels.js` 补模型；只有**非 OpenAI 兼容**的上游才需要写 executor。如果这个供应商本身就是 OpenAI 兼容的，多数情况下**不需要改代码**就能自行接入 —— 见 docs 里的自定义供应商接入篇。
        - **本仓库重写上游、不合并上游**。上游已有的同类功能不一定会直接照搬，会按本仓库的做法重新落地，所以「上游已经支持了」不构成必须做的理由，但值得在正文里提一句。
        - **大改动建议先开 issue 讨论**再提 PR，避免方向不一致导致返工。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决的问题
      description: 描述使用场景与当前的痛点。这一项比「解决方案」更重要。
      placeholder: |
        我在 … 场景下需要 …，
        目前因为 … 做不到，只能 …（临时绕法）。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你期望的方案
      description: 有具体设想就写（接口形态、配置项、UI 位置等）；没有也可以留空。
    validations:
      required: false

  - type: dropdown
    id: category
    attributes:
      label: 建议类别
      options:
        - 新增供应商 / 渠道适配
        - 新增 API 端点或协议能力
        - 路由 / 翻译 / Token 节省策略
        - 用量统计与计价
        - 仪表盘 / 桌面端 UI
        - 安装、部署与打包（含 fnOS / Docker）
        - 文档
        - 其他
    validations:
      required: true

  - type: checkboxes
    id: prechecked
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 issue，确认没有重复建议
          required: true
        - label: 我理解本仓库**重写上游功能而非合并上游**，实现方式可能与上游不同
          required: false

  - type: input
    id: upstream-ref
    attributes:
      label: 上游相关实现（可选）
      description: 若上游 9router 已有同类功能，填 tag / commit，便于参考其思路。
      placeholder: 例如 v0.5.91
    validations:
      required: false
